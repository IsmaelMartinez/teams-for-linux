<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waiting for your security key</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; background: #f5f5f5; }
      h3 { margin: 0 0 12px; font-size: 14px; color: #333; }
      /* `output` carries role="status" implicitly, so it needs the block layout
         and type of the paragraph it sits next to or the dialog reflows. */
      p, output { display: block; font-size: 12px; color: #666; margin: 0 0 8px; }
      .buttons { margin-top: 16px; display: flex; justify-content: flex-end; }
      button { padding: 6px 16px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: #fff; color: #333; }
    </style>
  </head>
  <body>
    <h3>Waiting for your security key</h3>
    <output>Touch your security key now to finish signing in.</output>
    <p>To sign in another way, cancel and choose a different method on the sign-in page.</p>
    <div class="buttons">
      <button type="button" id="cancel-btn" autofocus>Cancel</button>
    </div>
    <script>
      document.getElementById("cancel-btn").addEventListener("click", () => {
        globalThis.api.cancelTouch();
      });
    </script>
  </body>
</html>
