<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Security Key</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; background: #f5f5f5; }
      h3 { margin: 0 0 12px; font-size: 14px; color: #333; }
      p { font-size: 12px; color: #666; margin: 0; }
      .row { display: flex; align-items: center; gap: 12px; }
      .pulse { width: 28px; height: 28px; border-radius: 50%; background: #1757bd; flex-shrink: 0; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
    </style>
  </head>
  <body>
    <h3>Touch your security key</h3>
    <div class="row">
      <div class="pulse" aria-hidden="true"></div>
      <p>Your security key is waiting for a touch to approve the sign-in. Touch it when it blinks.</p>
    </div>
  </body>
</html>
