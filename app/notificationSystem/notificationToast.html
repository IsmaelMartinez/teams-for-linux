<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Toast</title>
    <style>
        /* Defaults; overridden from customNotification in config (see applyStyle below). */
        :root {
            --toast-background: #2D2D2D;
            --toast-hover-background: #3A3A3A;
            --toast-title-color: #FFFFFF;
            --toast-text-color: #D1D1D1;
            --toast-title-font-size: 14px;
            --toast-body-font-size: 13px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background-color: var(--toast-background);
            color: var(--toast-title-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body:hover {
            background-color: var(--toast-hover-background);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        body:active {
            background-color: var(--toast-hover-background);
            filter: brightness(0.95);
        }

        /* Header with title */
        header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .title-container {
            flex-grow: 1;
        }

        header .title {
            font-size: var(--toast-title-font-size);
            font-weight: 600;
            color: var(--toast-title-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Body text */
        main {
            display: flex;
            align-items: flex-start;
            flex-grow: 1;
            margin-bottom: 8px;
        }

        main p {
            font-size: var(--toast-body-font-size);
            color: var(--toast-text-color);
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow-wrap: break-word;
            margin: 0;
        }

        /* Footer with branding */
        footer {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            /* Follows the message colour; on the default background this is #888. */
            color: color-mix(in srgb, var(--toast-text-color) 55%, transparent);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
            margin-top: auto;
        }

        footer img {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }

        footer span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <header>
        <div class="title-container">
            <div class="title" id="title"></div>
        </div>
    </header>
    <main>
        <p id="body"></p>
    </main>
    <footer>
        <img src="../assets/icons/icon-monochrome-light-16x16.png" alt="logo">
        <span>Teams for Linux</span>
    </footer>

    <script>
        const STYLE_VARS = {
            backgroundColor: ['--toast-background', 'color'],
            hoverBackgroundColor: ['--toast-hover-background', 'color'],
            titleColor: ['--toast-title-color', 'color'],
            textColor: ['--toast-text-color', 'color'],
            titleFontSize: ['--toast-title-font-size', 'px'],
            bodyFontSize: ['--toast-body-font-size', 'px'],
        };

        // Values come from the user's config. Each one is checked with
        // CSS.supports and set as a single custom property, so an invalid
        // value keeps the default instead of breaking the stylesheet.
        function applyStyle(style) {
            if (!style || typeof style !== 'object') return;
            for (const [key, [property, kind]] of Object.entries(STYLE_VARS)) {
                const raw = style[key];
                const value = kind === 'px' ? `${Number(raw)}px` : String(raw ?? '');
                const valid = kind === 'px' ? Number.isFinite(Number(raw)) && Number(raw) > 0 : CSS.supports('color', value);
                if (raw !== undefined && valid) {
                    document.documentElement.style.setProperty(property, value);
                }
            }
        }

        // Show as many body lines as fit (at least the original 2), so a
        // taller toast shows more of the message.
        function fitBodyLines() {
            const body = document.getElementById('body');
            const lineHeight = Number.parseFloat(getComputedStyle(body).lineHeight);
            const available = document.querySelector('main').clientHeight;
            if (lineHeight > 0 && available > 0) {
                body.style.webkitLineClamp = String(Math.max(2, Math.floor(available / lineHeight)));
            }
        }

        globalThis.notificationApi.onNotificationToastInit((data, style) => {
            applyStyle(style);
            document.getElementById('title').innerText = data.title || 'Teams';
            document.getElementById('body').innerText = data.body || '';
            fitBodyLines();
        });

        document.body.addEventListener('click', () => {
            globalThis.notificationApi.notifyClick();
        });
    </script>
</body>

</html>
