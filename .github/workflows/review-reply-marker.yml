name: Review reply marker

# Inline review replies (pull_request_review, pull_request_review_comment) on a
# pull request from a fork run with a read-only GITHUB_TOKEN whatever the job
# declares, so the "awaiting user feedback" label cannot be removed from that
# run (#2992). This workflow therefore does nothing itself: it completes with
# `success` when a human who is not a maintainer replied, and "Remove awaiting
# feedback label on reply" picks that completion up through workflow_run, which
# runs in the base repository with write access. A maintainer or bot reply
# skips the job, so the run concludes `skipped` and nothing follows.
#
# Bots are matched on `user.type`, not on a "[bot]" login suffix: the PR
# reviewer posts as plain `Copilot` with author_association CONTRIBUTOR, so a
# suffix test would let its automated review clear the label.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  mark:
    runs-on: ubuntu-latest
    # `comment` is absent on pull_request_review, `review` on the other, so
    # each pair falls through to whichever the event actually supplied.
    if: >-
      (github.event.comment.user.type || github.event.review.user.type) != 'Bot'
      && !contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association
      )
    steps:
      - run: echo "Inline reply from a contributor; the label workflow takes it from here."
