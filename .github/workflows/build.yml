        run: npm run dist:windows -- --publish never

      - name: Upload PR artifacts
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teams-for-linux-windows-x64
          path: dist/*.exe
          retention-days: 30
          compression-level: 6

