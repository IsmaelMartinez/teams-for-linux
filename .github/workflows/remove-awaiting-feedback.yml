name: Remove awaiting feedback label on reply

# When someone other than a maintainer replies on an issue or pull request that
# carries the "awaiting user feedback" label, remove the label so maintainers
# know the reporter or contributor has responded.
#
# Two routes in. A top-level comment arrives as issue_comment, which runs in
# the base repository with the write permissions declared below. An inline
# review reply on a fork pull request does not: pull_request_review and
# pull_request_review_comment runs get a read-only GITHUB_TOKEN there, so the
# removal failed with 403 (#2992). Those events now run the unprivileged
# "Review reply marker" workflow, and its completion re-enters here through
# workflow_run, which does run with write access.
#
# Maintainer activity (OWNER / MEMBER / COLLABORATOR) and bot activity are
# ignored: a maintainer asking the question must not clear the flag that says
# the question is still outstanding. On the workflow_run route that is decided
# again here from the triggering actor, because the marker's own gate ran on
# the pull request's copy of its workflow file.

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Review reply marker"]
    types: [completed]

# Restrict default permissions — each job declares only what it needs
permissions: {}

jobs:
  remove-label:
    runs-on: ubuntu-latest
    # Bots are matched on `user.type`, not on a "[bot]" login suffix: the PR
    # reviewer posts as plain `Copilot` with author_association CONTRIBUTOR, so
    # a suffix test would let its automated review clear the label.
    #
    # issue_comment is by far the highest-volume trigger, and its payload does
    # carry labels, so gate it here and spare the runner. The marker concludes
    # `skipped` when its own gate declined, so only a `success` gets through.
    if: >-
      (
        github.event_name == 'issue_comment'
        && github.event.comment.user.type != 'Bot'
        && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && contains(github.event.issue.labels.*.name, 'awaiting user feedback')
      ) || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
      )
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Remove awaiting user feedback label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = 'awaiting user feedback';
            const { owner, repo } = context.repo;
            let issue_numbers;
            if (context.eventName === 'issue_comment') {
              // `issue` covers issues and pull requests alike.
              issue_numbers = [context.payload.issue.number];
            } else {
              const run = context.payload.workflow_run;
              const actor = run.triggering_actor ?? run.actor;
              if (!actor || actor.type === 'Bot') {
                core.info('Bot reply, nothing to do.');
                return;
              }
              // admin / write is what OWNER / MEMBER / COLLABORATOR amount to
              // on this repository; anyone else reads as a contributor. A user
              // with no access at all comes back 404, which means the same.
              let permission = 'none';
              try {
                ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: actor.login,
                }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (permission === 'admin' || permission === 'write') {
                core.info('Maintainer reply, nothing to do.');
                return;
              }
              // `pull_requests` is empty for fork pull requests, so fall back
              // to the run's head repository and branch, which identify the
              // pull request; a head SHA alone does not, and one page of
              // open pull requests may not hold it.
              issue_numbers = run.pull_requests.map((pr) => pr.number);
              if (issue_numbers.length === 0) {
                const open = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                });
                issue_numbers = open
                  .filter(
                    (pr) =>
                      pr.head.repo?.full_name === run.head_repository?.full_name &&
                      pr.head.ref === run.head_branch,
                  )
                  .map((pr) => pr.number);
              }
              if (issue_numbers.length === 0) {
                core.info('No open pull request matches the run, nothing to do.');
                return;
              }
            }
            // Labels are read back from the API rather than the payload: the
            // workflow_run route carries none, and the API is authoritative.
            for (const issue_number of issue_numbers) {
              const { data: target } = await github.rest.issues.get({ owner, repo, issue_number });
              if (!target.labels.some((label) => label.name === LABEL)) {
                core.info(`No "${LABEL}" label on #${issue_number}, nothing to do.`);
                continue;
              }
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL });
            }
