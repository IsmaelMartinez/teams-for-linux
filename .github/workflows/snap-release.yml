name: Snap Release

on:
  release:
    types: [published]

# Restrict default permissions — each job declares only what it needs
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  snap-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@d33c176a9b784876d966f80fb1b461808edc0641 # v2.1.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        # --ignore-scripts blocks arbitrary dependency lifecycle scripts; the
        # explicit postinstall keeps electron-builder install-app-deps (native
        # dep rebuild) that packaging needs.
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Build snap
        run: npm run dist:linux:snap -- --publish never

      - name: Publish to candidate channel
        run: |
          SNAP_FILE=$(ls dist/*.snap)
          echo "Uploading ${SNAP_FILE} to candidate channel"
          snapcraft upload "${SNAP_FILE}" --release=candidate

  snap-candidate-armv7l:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@d33c176a9b784876d966f80fb1b461808edc0641 # v2.1.1

      - name: Install and initialize LXD
        # core24 builds run `snapcraft pack --use-lxd` on every arch (no more
        # direct app-builder template packing). armv7l is a snapcraft
        # cross-build: platforms build-on amd64 / build-for armhf.
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        # --ignore-scripts blocks arbitrary dependency lifecycle scripts; the
        # explicit postinstall keeps electron-builder install-app-deps (native
        # dep rebuild) that packaging needs.
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Build snap
        run: npm run dist:linux:snap:armv7l -- --publish never

      - name: Publish to candidate channel
        run: |
          SNAP_FILE=$(ls dist/*.snap)
          echo "Uploading ${SNAP_FILE} to candidate channel"
          snapcraft upload "${SNAP_FILE}" --release=candidate

  snap-candidate-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        # The core24 `snapcraft` target builds via `snapcraft pack`, which is
        # supported on snapcraft 8.x and 9.x alike, so the former 8.x/stable
        # pin (needed only for the legacy core22 `snapcraft snap` command,
        # #2590/#2592) is no longer required.
        uses: samuelmeuli/action-snapcraft@d33c176a9b784876d966f80fb1b461808edc0641 # v2.1.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        # --ignore-scripts blocks arbitrary dependency lifecycle scripts; the
        # explicit postinstall keeps electron-builder install-app-deps (native
        # dep rebuild) that packaging needs.
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Build snap
        run: npm run dist:linux:snap:arm64 -- --publish never

      - name: Publish to candidate channel
        run: |
          SNAP_FILE=$(ls dist/*.snap)
          echo "Uploading ${SNAP_FILE} to candidate channel"
          snapcraft upload "${SNAP_FILE}" --release=candidate
