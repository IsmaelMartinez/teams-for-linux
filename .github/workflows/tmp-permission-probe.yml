name: TEMP permission probe

# Throwaway experiment: does removeLabel on a PR need `issues: write`,
# `pull-requests: write`, or either? Probes with a label that is not present,
# so nothing is mutated: 404 means the scope was accepted, 403 means it was not.
# Delete this file before merging.

on:
  pull_request:

permissions: {}

jobs:
  issues-scope:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'zz-probe-label-does-not-exist',
              });
              core.notice('ISSUES SCOPE: unexpected success');
            } catch (error) {
              core.notice(`ISSUES SCOPE: status=${error.status}`);
            }

  pulls-scope:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'zz-probe-label-does-not-exist',
              });
              core.notice('PULLS SCOPE: unexpected success');
            } catch (error) {
              core.notice(`PULLS SCOPE: status=${error.status}`);
            }
